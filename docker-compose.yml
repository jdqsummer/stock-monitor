version: "3.8"

services:
  app:
    build: .
    env_file: .env
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - frontend_dist:/app/frontend/dist
    depends_on:
      - app
      - frontend

  redis:
    image: redis:7-alpine

volumes:
  frontend_dist:
