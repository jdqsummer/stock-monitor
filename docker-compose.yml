version: "3.8"

services:
  # 后端 API
  app:
    build:
      context: .
      args:
        # 国内 pip 镜像（默认官方源，其他环境不受影响）
        PIP_INDEX_URL: https://mirrors.cloud.tencent.com/pypi/simple
    env_file: .env
    environment:
      # DSH 接线（值可被 .env 覆盖：${VAR:-default} 优先读 .env）
      - DSH_ENABLED=${DSH_ENABLED:-true}
      - DSH_ENGINE_URL=${DSH_ENGINE_URL:-http://dsh-engine:8001}
      - DSH_CALC_URL=${DSH_CALC_URL:-http://dsh-engine:8002}
      # 投资日记图片目录：复用 app_data 卷，容器重建图片不丢
      - DIARY_IMAGE_DIR=${DIARY_IMAGE_DIR:-/app/data/diary_images}
    # 启动前先跑 alembic 迁移建表（新库无表则 API 报错），再启动 uvicorn
    command: sh -c "alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    # SQLite 数据持久化：容器重建不丢库
    volumes:
      - app_data:/app/data
      # 聊天 persona（方案C backend 读取）：改 .md + 重启生效
      - ./.dsh/skills:/app/.dsh/skills:ro
    # 健康检查：供 nginx 等服务等待后端真正就绪
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - redis
    # 网络别名 backend：DSH invest-data-mcp 的 streamable-http 通道按设计连
    # http://backend:8000/mcp/investdata（见 main.py 注释），而 compose 服务名是 app，
    # 不加别名则 dsh-engine 容器内 DNS 无法解析 backend → MCP 辅助通道建立失败。
    networks:
      default:
        aliases:
          - backend

  # 前端构建服务：构建产物写入共享卷后退出
  # (不直接暴露端口，由主 nginx 服务静态文件)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 国内 npm 镜像（默认官方源，其他环境不受影响）
        NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
    volumes:
      - frontend_dist:/app/dist
    command: sh -c "cp -r /usr/share/nginx/html/. /app/dist/ && echo 'frontend dist copied to shared volume'"

  # 反向代理 + 静态文件服务
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - frontend_dist:/usr/share/nginx/html
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully

  # 缓存
  redis:
    image: redis:7-alpine

  # DSH 分析引擎（P4 双容器：SDK 宿主 + dsh-jsonrpc-agent 同容器）
  dsh-engine:
    build:
      context: .
      dockerfile: dsh-engine/Dockerfile
      args:
        # 国内 npm 镜像（默认官方源，其他环境不受影响）
        NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
        # 国内 pip 镜像（默认官方源，其他环境不受影响）
        PIP_INDEX_URL: https://mirrors.cloud.tencent.com/pypi/simple
    environment:
      - DSH_ENGINE_PORT=8001
      # I4 确定性计算端点端口（calc_host.py 读此 env；sdk_host 8001 与其无冲突）
      - DSH_CALC_PORT=8002
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DSH_TOOLS_MODE=${DSH_TOOLS_MODE:-native}
      # S3 会话日志留存清理（entrypoint 后台循环，值可被 .env 覆盖）
      - DSH_SESSION_RETENTION_DAYS=${DSH_SESSION_RETENTION_DAYS:-90}
      - DSH_SESSION_MAX_COUNT=${DSH_SESSION_MAX_COUNT:-10000}
      - DSH_CLEANUP_INTERVAL_SECONDS=${DSH_CLEANUP_INTERVAL_SECONDS:-86400}
    volumes:
      # 会话日志持久化（S3 留存载体）：容器重建不丢
      - dsh_sessions:/app/sessions
      # I3 只读挂载（脚本防篡改）：skills 方法论资产 + plugins 插件脚本只读
      # 开发期热更新可改为 :rw 或去掉挂载（改用镜像内 COPY 的副本）
      - ./.dsh/skills:/app/.dsh/skills:ro
      - ./.dsh/plugins:/app/.dsh/plugins:ro
    healthcheck:
      # sdk_host.py 仅暴露 POST /trigger，无 /health；用 FastAPI 自动生成的 /openapi.json 探活
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/openapi.json')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  frontend_dist:
  app_data:
  dsh_sessions:
