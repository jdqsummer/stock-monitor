# `value-investor` headless 独立完整组合（生产 DSH 引擎用）
#
# 为什么需要本文件：`agent.cordis.yml` 是 preset-plane 组合（供 web/tui 的 preset
# 目录 mount，host 提供核心服务）。headless 的 sdk_host 通过 `DSH_CORDIS_CONFIG` 传
# cordis 时，runtime **替换**而非合并配置 → 必须自包含全部插件，否则插件树加载失败：
#
#   生产实测（2026-08-15）：
#   - `@deepseek-ai/dsh-agent-default-model` / `@deepseek-ai/dsh-mcp-client`
#     不在 runtime 内嵌 snapshot → 包名引用报 `Cannot find package ... imported
#     from /snapshot/...` → 改 `file://` 指向 /app/node_modules（需为 dsh-engine
#     package.json 直接依赖，pnpm 链接 + store 内嵌套 node_modules 逐层可解析传递依赖）。
#   - ⚠️ `@deepseek-ai/dsh-tools` 不能单独用 `file://` 挂载：agent-spine-demo 内嵌
#     snapshot 内部也会 `ctx.plugin(ToolRuntime)` 挂同一服务。若 cordis 再以 file://
#     挂一个 /app/node_modules 实例，两实例的 `TOOL_RUNTIME_SCHEDULER` 是不同模块级
#     Symbol → agent-loop 从 snapshot 实例取 scheduler 得 undefined → 首次工具调用崩
#     `Cannot read properties of undefined (reading 'prepare')`。故 **不挂 tools 行**，
#     tools 服务由 agent-spine 内嵌 snapshot 提供（自研插件 `ctx.tools.register(defineTool(...))`
#     的 ToolDefinition 是普通对象，跨实例兼容）。
#   - 核心 8 插件（sdk-jsonrpc-server/agent-spine/llm-deepseek/sessions/...）内嵌于
#     runtime snapshot → 包名引用即可（见 runtime 自带 bundled default cordis.yml）。
#   - `agent-default-model` 裸行缺 config 会报 `$.provider missing required value`，
#     必须给 `{ provider, model }`。
#   - `invest-five-stage` 插件 `inject: ['tools','workflowEngine']` 需要 workflow 栈：
#     `dsh-subagent`（subagents 注册表）+ `dsh-subagent-spawn-in-process`（providerName:
#     spawn）+ `dsh-workflow-worker-thread`（provider: spawn）。缺任一 → 插件树激活失败
#     （`waiting for service: workflowEngine`）→ boot 抛错但 fail-loud 让进程存活 →
#     initialize/session/prompt 永不响应 → sdk_host /trigger 无限挂起（P4 坑位 17 根因）。
#     三者均在 runtime snapshot 依赖闭包内（sdk-runtime package.json），包名引用即可。
#
# ⚠️ file:// 路径是生产容器内绝对路径（/app/node_modules），仅 headless 生产使用；
# 本地开发（Windows/WSL）走 dev harness 路径，不读本文件。

# —— 核心 8 插件（与 runtime bundled default cordis.yml 一致，均内嵌 snapshot）——
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: agent-core
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext:
      maxBytes: 65536

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

# —— host-plane 服务补充（默认模型；snapshot 缺失 → file://）——
# 注意：tools 服务不在此挂载 —— 由 agent-spine 内嵌 snapshot 提供（见头部注释，
# 双实例会破坏 tool scheduler 的模块级 Symbol 匹配）。
- id: agent-default-model
  name: 'file:///app/node_modules/@deepseek-ai/dsh-agent-default-model/lib/index.js'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

# —— workflow + subagent 栈（invest-five-stage 的 workflowEngine 依赖；均在 snapshot 闭包）——
- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: workflow-worker-thread
  name: '@deepseek-ai/dsh-workflow-worker-thread'
  config:
    provider: spawn

# —— skill 注册表 + 目录/加载工具（内嵌 snapshot，包名引用）——
- id: skill
  name: '@deepseek-ai/dsh-skill'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# —— 自定义（value-investor 预设内容，file:// 绝对 URL）——
- id: hello-tool
  name: 'file:///app/.dsh/agent-presets/value-investor/hello-tool.mjs'

- id: invest-five-stage
  name: 'file:///app/.dsh/plugins/invest-five-stage/index.mjs'

- id: invest-guard
  name: 'file:///app/.dsh/plugins/invest-guard/index.mjs'

- id: invest-schema
  name: 'file:///app/.dsh/plugins/invest-schema/index.mjs'

- id: invest-data-mcp
  name: 'file:///app/node_modules/@deepseek-ai/dsh-mcp-client/lib/index.js'
  config:
    serverName: investdata
    transport: streamable-http
    url: http://backend:8000/mcp/investdata
    failOnStartupError: false

- id: invest-telemetry
  name: 'file:///app/.dsh/plugins/invest-telemetry/index.mjs'
