server {
    listen 80;
    server_name _;

    # ── 宣传落地页（独立路径 /about，bind-mount 见 docker-compose.yml） ──
    # /about → 301 到 /about/；/about/ → index landing.html；相对路径 screens/ 正常解析
    location = /about { return 301 /about/; }
    location /about/ {
        alias /usr/share/nginx/html/about/;
        index landing.html;
    }

    # ── 前端静态文件（来自 frontend_dist 共享卷） ──
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # ── API 反向代理（普通请求） ──
    location /api/ {
        # 变量 + Docker 内置 DNS：app 容器重建（IP 变化）后自动重新解析，避免 502
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api http://app:8000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SSE 流式对话（Chat Agent） ──
    # 精确前缀匹配优先于 /api/，需关闭 buffering 以逐 token 推送
    location /api/chat/stream {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_sse http://app:8000;
        proxy_pass $upstream_sse;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }
}
