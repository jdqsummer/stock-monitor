# stock-monitor/alembic.ini
[alembic]
script_location = alembic
# 使项目根目录进入 sys.path，否则 alembic 无法 import backend.*
prepend_sys_path = .
sqlalchemy.url = sqlite+aiosqlite:///./stock_monitor.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
